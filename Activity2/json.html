<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Aethera Pastries</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="assets/img/Group13.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <style>
        :root {
            --espresso: #4B3327;
            --caramel: #C98B45;
            --wheat: #E8C49A;
            --cream: #FFF9EF;
            --peach: #F5DCC0;
            --berry: #B5364A;
            --muted: #6B5444;
        }

        body {
            color: var(--espresso);
            font-family: Georgia, "Times New Roman", serif;
            background: url("assets/img/bg.svg") center / cover fixed, var(--peach);
        }

        .brown-bar {
            background: linear-gradient(135deg, var(--espresso), #6b4a38);
            color: var(--cream);
            border-bottom: 3px solid var(--caramel);
        }

        .cream {
            background: var(--cream);
            color: var(--espresso);
            border: 1px solid var(--wheat);
        }

        .btn.cream:hover {
            background: var(--peach);
            color: var(--espresso);
            border-color: var(--caramel);
        }

        .btn.cream.active {
            background: var(--espresso);
            color: var(--cream);
            border-color: var(--espresso);
        }

        .form-control.cream:focus {
            background: var(--cream);
            color: var(--espresso);
            border-color: var(--caramel);
            box-shadow: 0 0 0 .25rem rgba(201, 139, 69, .25);
        }

        .product-card {
            background: var(--cream);
            color: var(--espresso);
            border: 0;
            border-bottom: 3px solid var(--caramel);
        }

        .price {
            color: var(--berry);
        }

        .tag-classic {
            background: #8a6d3b;
        }

        .tag-sweet {
            background: var(--berry);
        }

        .tag-savory {
            background: var(--espresso);
        }

        .tag-spicy {
            background: #b5481c;
        }

        .tag-bestseller {
            background: #07268c;
        }

        .name,
        .info {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .name {
            -webkit-line-clamp: 2;
            line-clamp: 2;
            min-height: 2.4em;
            line-height: 1.2;
        }

        .info {
            -webkit-line-clamp: 3;
            line-clamp: 3;
            min-height: 4.5em;
            line-height: 1.5;
            color: var(--muted);
        }

        @media (max-width: 380px) {
            #parent>* {
                flex: 0 0 100%;
                max-width: 100%;
            }
        }
    </style>
</head>

<body id="top" class="d-flex flex-column min-vh-100">

    <div class="px-3 pt-3">
        <header class="brown-bar text-center rounded-4 shadow-sm p-4">
            <div class="small text-uppercase" style="color: var(--wheat); letter-spacing: .12em;">Crafted fresh each
                dawn</div>
            <h1 class="mb-0">Aethera Pastries</h1>
        </header>
    </div>

    <main class="container flex-grow-1 py-4">
        <div class="row justify-content-center mb-3">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <input id="search" type="search" class="form-control cream rounded-pill shadow-sm"
                    placeholder="Search the menu" aria-label="Search the menu" />
            </div>
        </div>

        <div id="filters" class="d-flex flex-wrap justify-content-center gap-2 mb-4"></div>
        <div id="status" class="visually-hidden" aria-live="polite"></div>

        <div id="parent" class="row g-3"></div>
    </main>

    <footer class="brown-bar border-bottom-0 border-top border-2 mt-5 py-4"
        style="border-top-color: var(--caramel) !important; border-radius: 26px 26px 0 0;">
        <div class="container">
            <div class="text-center small">
                &copy; 2026 Aethera Pastries. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
    const folder = "assets/img/", $ = id => document.getElementById(id);
        const menu = [
            {
                category: "Classic", products: [
                    {
                        name: "Cheese roll",
                        price: 40,
                        image: "cheeseroll.jpeg",
                        info: "Soft bread rolled around creamy cheese."
                    },
                    {
                        name: "Banana bread",
                        price: 79,
                        image: "bananabread.jpeg",
                        info: "Moist, naturally sweet loaf made without eggs or butter.",
                        bestSeller: true
                    },
                ]
            },
            {
                category: "Sweet", products: [
                    {
                        name: "Chocolate croissant",
                        price: 80,
                        image: "chocolatecroissant.jpeg",
                        info: "Crisp, flaky layers wrapped around rich chocolate."
                    },
                    {
                        name: "Cinnamon roll",
                        price: 70,
                        image: "cinnamonroll.jpeg",
                        info: "Swirled dough with cinnamon filling and sweet icing."
                    },
                ]
            },
            {
                category: "Savory", products: [
                    {
                        name: "Chicken floss bread",
                        price: 55,
                        image: "chickenfloss.jpeg",
                        info: "Soft, sweet bun topped with fluffy shredded chicken.",
                        bestSeller: true
                    },
                    {
                        name: "Garlic cheese bread",
                        price: 55,
                        image: "garlicbread.jpeg",
                        info: "Toasted bread brushed with garlic butter and cheese.",
                        bestSeller: true
                    },
                ]
            },
            {
                category: "Spicy", products: [
                    {
                        name: "Spicy tuna pie",
                        price: 60,
                        image: "spicytunapie.jpeg",
                        info: "Chili-spiced tuna in a flaky pie crust."
                    },
                    {
                        name: "Pepperoni pizza roll",
                        price: 80,
                        image: "pizzaroll.jpeg",
                        info: "Pepperoni and melted cheese in a warm baked roll.",
                        bestSeller: true
                    },
                ]
            },
        ];

          const products = menu.flatMap(m => m.products.map(p => ({ ...p, category: m.category })));
            const sortLabels = { az: "Sort by price", low: "Price: ↑", high: "Price: ↓" };
            let cat = "All", query = "", sort = "az";

            const button = (attrs, on, text) =>
                `<button type="button" class="btn btn-sm rounded-pill shadow-sm cream ${on ? "active" : ""}" ${attrs}>${text}</button>`;

            const card = p => `
        <div class="col-6 col-lg-3">
          <div class="card product-card h-100 p-2 p-md-3 shadow-sm rounded-4">
            <div class="position-relative mb-2 mb-md-3">
              <div class="ratio ratio-4x3 rounded-3 overflow-hidden bg-light">
                <img src="${folder + p.image}" alt="${p.name}" class="object-fit-cover" loading="lazy" />
              </div>
              <span class="position-absolute top-0 start-0 m-2 badge shadow-sm tag-${p.category.toLowerCase()}">${p.category}</span>
              ${p.bestSeller ? `<span class="position-absolute top-0 end-0 m-2 badge shadow-sm tag-bestseller">Best seller</span>` : ""}
            </div>
            <div class="h5 name mb-1">${p.name}</div>
            <div class="small info flex-grow-1">${p.info}</div>
            <div class="price fw-bold mt-2 mt-md-3">₱${p.price.toLocaleString("en-PH")}</div>
          </div>
        </div>`;

            function render() {
                $("filters").innerHTML =
                    ["All", ...menu.map(m => m.category)].map(c => button(`data-category="${c}" aria-pressed="${c === cat}"`, c === cat, c)).join("")
                    + button(`data-price="1" aria-label="Sort by price"`, sort !== "az", sortLabels[sort]);

                const q = query.trim().toLowerCase(), dir = sort === "high" ? -1 : 1;
                const list = products
                    .filter(p => (cat === "All" || p.category === cat) && `${p.name} ${p.info}`.toLowerCase().includes(q))
                    .sort((a, b) => (sort === "az" ? 0 : (a.price - b.price) * dir) || a.name.localeCompare(b.name));

                $("parent").innerHTML = list.map(card).join("") ||
                    `<p class="col-12 text-center py-5 h5">Nothing matches "${q.replace(/</g, "&lt;")}"</p>`;
                $("status").textContent = `${list.length} shown`;
            }

            $("filters").onclick = e => {
                const b = e.target.closest("button");
                if (!b) return;
                b.dataset.price ? sort = sort === "low" ? "high" : "low" : cat = b.dataset.category;
                render();
            };
            $("search").oninput = e => { query = e.target.value; render(); };

            render();
        </script>
    </body>
    
    </html>
