<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e3c3"/>
      <stop offset="1" stop-color="#e8b98a"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <g filter="url(#blur)">
    <circle cx="200" cy="180" r="260" fill="#c98a4b" opacity=".75"/>
    <circle cx="1350" cy="150" r="230" fill="#a23b4b" opacity=".45"/>
    <circle cx="800" cy="520" r="280" fill="#fff3d6" opacity=".9"/>
    <circle cx="250" cy="820" r="250" fill="#8a6d3b" opacity=".5"/>
    <circle cx="1400" cy="800" r="290" fill="#d9a066" opacity=".8"/>
    <circle cx="950" cy="940" r="180" fill="#b5481c" opacity=".35"/>
  </g>
</svg>
